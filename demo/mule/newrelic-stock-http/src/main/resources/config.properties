# Mule application properties (resolved by Mule's property placeholder, NOT log4j).
# Port 8082 (the batch sibling uses 8081) so both apps can run side-by-side for A/B.
http.port=8082
# NOTE: the New Relic 'hostname' and 'service' facets are NO LONGER emitted from the flow's
# log message. They are set from CONFIG in log4j2.xml (the nr.hostname and app.service props):
#   hostname <- ${sys:domain}  (the CloudHub app name; CloudHub sets -Ddomain automatically),
#               falling back to the machine hostname off-platform.
#               (This is New Relic's reserved host attribute, distinct from the intake endpoint.)
#   service  <- this app's own name, as a literal, so it is distinguishable from the batch
#               sibling in New Relic.
# Neither takes a deploy-time override: a system property that is present but EMPTY beats a
# ${sys:x:-default} default and would silently blank the facet. See log4j2.xml.
# The flow text is therefore byte-identical to the batch sibling (no per-app host.name here).
# Set your New Relic ingest/license key here, or override at runtime via the
# NEW_RELIC_API_KEY env var / -Dnewrelic.apiKey JVM arg (see log4j2.xml).
NEW_RELIC_API_KEY=YOUR_NEW_RELIC_INGEST_KEY
