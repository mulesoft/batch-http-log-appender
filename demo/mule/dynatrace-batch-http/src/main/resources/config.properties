# Mule application properties (resolved by Mule's property placeholder, NOT log4j).
# Port 8087 keeps this app clear of the New Relic (8081/8082), Datadog (8083/8084) and
# Elasticsearch (8085/8086) demos and of its own stock-HTTP control sibling (8088), so all
# eight can run side-by-side.
http.port=8087
# Set your Dynatrace environment URL and access token here, or override at runtime via
# the DT_ENVIRONMENT_URL / DT_API_TOKEN env vars / -Ddynatrace.url / -Ddynatrace.token JVM args
# (see log4j2.xml). In CloudHub, set dynatrace.token as a SECURE application property.
DT_ENVIRONMENT_URL=YOUR_DYNATRACE_ENVIRONMENT_URL
DT_API_TOKEN=YOUR_DYNATRACE_ACCESS_TOKEN
# log.source comes from config in log4j2.xml (dt.source: the CloudHub app name via
# ${sys:domain}), so the flow text stays byte-identical to the stock sibling.
