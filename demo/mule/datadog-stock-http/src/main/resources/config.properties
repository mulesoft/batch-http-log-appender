# Mule application properties (resolved by Mule's property placeholder, NOT log4j).
# Port 8084 (the batch sibling uses 8083) so both apps can run side-by-side for A/B.
http.port=8084
# NOTE: the Datadog 'host' and 'service' facets are NO LONGER emitted from the flow's log
# message. They are set from CONFIG in log4j2.xml (the dd.host and app.service properties,
# injected into the stock <Http> appender's PatternLayout):
#   host    <- ${sys:domain}  (the CloudHub app name; CloudHub sets -Ddomain automatically),
#              falling back to the machine hostname off-platform.
#   service <- this app's own name, as a literal, so it is distinguishable from the batch
#              sibling in Datadog.
# Neither takes a deploy-time override: a system property that is present but EMPTY beats a
# ${sys:x:-default} default and would silently blank the facet. See log4j2.xml.
# The flow text is therefore byte-identical to the batch sibling (no per-app host.name here).
# Set your Datadog API key here, or override at runtime via the DD_API_KEY env var
# / -Ddatadog.apiKey JVM arg (see log4j2.xml).
DD_API_KEY=YOUR_DATADOG_API_KEY
