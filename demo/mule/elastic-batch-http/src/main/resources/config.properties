# Mule application properties (resolved by Mule's property placeholder, NOT log4j).
# Port 8085 keeps this app clear of the New Relic (8081/8082) and Datadog (8083/8084)
# demos and of its own stock-HTTP control sibling (8086), so all six can run side-by-side.
http.port=8085
# Set your Elasticsearch endpoint and encoded API key here, or override at runtime via
# the ELASTIC_URL / ELASTIC_API_KEY env vars / -Delastic.url / -Delastic.apiKey JVM args
# (see log4j2.xml). In CloudHub, set elastic.apiKey as a SECURE application property.
ELASTIC_URL=YOUR_ELASTICSEARCH_ENDPOINT
ELASTIC_API_KEY=YOUR_ELASTIC_ENCODED_API_KEY
# service.name and host.name come from config in log4j2.xml (app.service and es.host),
# so the flow text stays byte-identical to the stock sibling.
